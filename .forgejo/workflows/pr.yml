name: Poltergeist PR Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # This label is not registered until the Windows runner exists.
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: windows-stable-workspace
          save-if: true
          cache-on-failure: true

      - name: Run quality checks
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Ensure admin-edition binary compiles
        run: cargo check -p poltergeist-app --features admin-edition --locked
